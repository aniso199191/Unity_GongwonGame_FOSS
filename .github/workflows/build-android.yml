name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Setup Unity
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          unity-version: 2022.3.48f1
          modules: android

      - name: Activate License (Attempt 1)
        id: activate1
        uses: RageAgainstThePixel/activate-unity-license@v2
        continue-on-error: true
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Activate License (Attempt 2)
        id: activate2
        if: steps.activate1.outcome == 'failure'
        uses: RageAgainstThePixel/unity-activate@v2
        continue-on-error: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Activate License (Attempt 3)
        id: activate3
        if: steps.activate2.outcome == 'failure'
        uses: game-ci/unity-activate@v2
        continue-on-error: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Check License Status
        if: steps.activate1.outcome == 'failure' && steps.activate2.outcome == 'failure' && steps.activate3.outcome == 'failure'
        run: |
          echo "所有激活方式均失败，请检查 Secrets 或手动干预。"
          exit 1

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidBuild
          path: build/Android/*.apk
